name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.5
    timeout-minutes: 5
    steps:
      - name: Check out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$PWD"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD

      - name: Test reply inboxes
        run: python3 scripts/test_claude_peer.py

  workflows:
    name: Lint workflows
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.5
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
      - name: actionlint
        uses: https://git.samhuri.net/sjs/actions/actionlint@v1
